<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    width:1080px;
    height:1350px;
    margin:0;
}

</style>

</head>

<body class="bg-slate-900 text-white flex flex-col justify-between p-20">

<div>

<div class="text-blue-400 text-2xl font-semibold">

🏠 AssetPicker

</div>

<h1 class="text-7xl font-bold leading-tight mt-12">

{{story.headline}}

</h1>

<p class="text-3xl text-gray-300 mt-12 leading-relaxed">

{{story.summary}}

</p>

</div>

<div>

<div class="text-gray-400 text-xl">

{{story.news.source}}

</div>

<div class="mt-4 text-gray-500">

{{story.news.published_at.strftime("%Y.%m.%d")}}

</div>

</div>

</body>

</html>
