<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetPicker Development Update</title>

    <style>

        :root {
            --accent: #62E6DF;
            --accent-soft: rgba(98,230,223,.30);
            --accent-faint: rgba(98,230,223,.12);
        }

        @font-face {
            font-family: "Pretendard";
            src: url("{{ shared_asset_path }}/PretendardVariable.ttf") format("truetype");
            font-weight: 100 900;
            font-style: normal;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1350px;
        }

        * {
            box-sizing: border-box;
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }

        body {
            background: #111111;
        }

        .card {
            position: relative;

            width: 1080px;
            height: 1350px;

            overflow: hidden;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(20, 52, 58, .28),
                    transparent 44%
                ),
                linear-gradient(
                    180deg,
                    #07151c 0%,
                    #061219 48%,
                    #040c11 100%
                );
        }

        .bg {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
        }

        .header {
            position: absolute;

            top: 56px;
            left: 80px;
            right: 80px;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            z-index: 100;
        }

        .header-brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .header-logo {
            height: 66px;
            width: auto;

            display: block;

            opacity: 0.70;
        }

        .header-subtitle {
            margin-top: 8px;

            font-size: 18px;
            font-weight: 500;

            color: rgba(255,255,255,.85);
        }

        .header-page {
            font-size: 28px;
            font-weight: 700;

            color: #ffffff;
        }

        .footer {
            position: absolute;

            left: 56px;
            right: 56px;
            bottom: 47px;

            z-index: 100;
        }

        .footer-divider {
            height: 1px;

            background: var(--accent-soft);
        }

        .footer-content {
            margin-top: 22px;

            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .footer-left {
            display: flex;
            align-items: flex-end;

            gap: 18px;
        }

        .footer-logo {
            height: 34px;
            width: auto;

            opacity: .70;
        }

        .footer-powered,
        .footer-right {
            font-size: 15px;
            font-weight: 500;

            color: rgba(255,255,255,.80);
        }

        .footer-powered strong,
        .footer-right strong {
            color: var(--accent);
            font-weight: 700;
        }

        .gold {
            color: var(--accent);
        }

        {% block styles %}{% endblock %}
    </style>
</head>


<body>

<div class="card">

    <header class="header">

        <div class="header-brand">

            <img
                src="{{ shared_asset_path }}/icons/APDaily.svg"
                class="header-logo"
                alt="AP Daily"
            >

            <div class="header-subtitle">
                {{ today }}
            </div>

        </div>


        <div class="header-page">
            {{ page }} / {{ total }}
        </div>

    </header>


    {% block content %}{% endblock %}


    <footer class="footer">

        <div class="footer-divider"></div>


        <div class="footer-content">

            <div class="footer-left">

                <img
                    src="{{ shared_asset_path }}/icons/logo_white.svg"
                    class="footer-logo"
                    alt="AssetPicker"
                >

                <div class="footer-powered">
                    Powered by <strong>Dustie</strong>
                </div>

            </div>


            <div class="footer-right">

                Copyright © <strong>AssetPicker</strong>
                · Built with DustyDraft®

            </div>

        </div>

    </footer>

</div>

</body>
</html>
