{% extends "base.html" %}

{% block styles %}

<style>

/* =========================================
   BACKGROUND
========================================= */

.overlay {
    background:
        linear-gradient(
            180deg,
            rgba(5, 12, 25, 0.28) 0%,
            rgba(5, 12, 25, 0.42) 45%,
            rgba(5, 12, 25, 0.62) 100%
        );
}

/* =========================================
    TEXT SHADOW
========================================= */

.content {
 text-shadow:
     0 2px 8px rgba(0, 0, 0, 0.38),
     0 1px 2px rgba(0, 0, 0, 0.28);
}

/* =========================================
   HEADER
========================================= */

.header {
    position: absolute;

    top: 56px;
    left: 80px;
    right: 80px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 10;
}


.logo {
    height: 66px;

    opacity: 0.70;
}


.page-number {
    font-size: 28px;
    font-weight: 700;

    color: #ffffff;
}


/* =========================================
   MAIN
========================================= */

.content {
    position: absolute;

    top: 47%;
    left: 50%;

    width: 860px;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 10;
}


.intro-title {
    margin: 0;

    font-size: 76px;
    line-height: 1.08;

    font-weight: 800;

    letter-spacing: -2px;

    color: #ffffff;
}


.gold {
    color: #d4af37;
}


.intro-description {
    width: 720px;

    margin: 48px auto 0;

    font-size: 30px;
    line-height: 1.7;

    color:
        rgba(
            255,
            255,
            255,
            0.92
        );
}

.dustie-inline {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 8px;
}


.dustie-mini {
    width: 26px;
    height: 26px;

    object-fit: contain;

    filter: brightness(0) invert(1);

    opacity: 0.88;
}


.intro-divider {
    width: 720px;
    height: 1px;

    margin: 56px auto;

    background:
        rgba(
            212,
            175,
            55,
            0.35
        );
}


/* =========================================
   CATEGORIES
========================================= */

.intro-categories {
    width: 760px;

    margin: 0 auto;

    display: flex;
    justify-content: space-between;
}


.intro-category {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 24px;
    font-weight: 600;

    color: #ffffff;
}


.intro-category:not(:first-child) {
    border-left:
        1px solid
        rgba(
            255,
            255,
            255,
            0.15
        );
}


.intro-icon {
    width: 48px;
    height: 48px;

    margin-bottom: 18px;

    filter:
        brightness(0)
        invert(1);
}


/* =========================================
   FOOTER
========================================= */

.footer {
    position: absolute;

    left: 56px;
    right: 56px;
    bottom: 47px;

    z-index: 10;
}


.footer-divider {
    height: 1px;

    background:
        rgba(
            255,
            255,
            255,
            0.20
        );
}


.footer-content {
    margin-top: 22px;

    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}


.footer-left {
    display: flex;

    align-items: flex-end;

    gap: 18px;
}


.footer-logo {
    height: 34px;

    opacity: 0.70;
}


.footer-powered,
.footer-right {
    font-size: 15px;
    font-weight: 500;

    color:
        rgba(
            255,
            255,
            255,
            0.80
        );
}


.footer-powered strong,
.footer-right strong {
    color: #d4af37;

    font-weight: 700;
}

</style>

{% endblock %}


{% block content %}

<div class="card">

    <img
        class="bg"
        src="{{ asset_path }}/images/intro.png"
        alt=""
    >

    <div class="overlay"></div>

    <main class="content">

        <h1 class="intro-title">

            <span class="gold">
                Today's
            </span>

            <br>

            Real Estate

            <br>

            Briefing

        </h1>


        <p class="intro-description">

            지난 24시간 동안의 Google News를 기반으로<br>
        
            <span class="dustie-inline">
                <img
                    src="{{ asset_path }}/dustie.svg"
                    class="dustie-mini"
                    alt=""
                >
                AI Editor Dustie가
            </span>
        
            <br>
        
            가장 중요한 부동산 뉴스를<br>
        
            빠르고 간결하게 전달합니다.
        
        </p>


        <div class="intro-divider"></div>


        <div class="intro-categories">

            <div class="intro-category">

                <img
                    src="{{ asset_path }}/icons/building.svg"
                    class="intro-icon"
                    alt=""
                >

                <span>정책</span>

            </div>


            <div class="intro-category">

                <img
                    src="{{ asset_path }}/icons/chart-column.svg"
                    class="intro-icon"
                    alt=""
                >

                <span>시장</span>

            </div>


            <div class="intro-category">

                <img
                    src="{{ asset_path }}/icons/search.svg"
                    class="intro-icon"
                    alt=""
                >

                <span>개발</span>

            </div>


            <div class="intro-category">

                <img
                    src="{{ asset_path }}/icons/house.svg"
                    class="intro-icon"
                    alt=""
                >

                <span>재건축</span>

            </div>

        </div>

    </main>


</div>

{% endblock %}
