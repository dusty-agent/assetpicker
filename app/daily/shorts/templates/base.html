<style>

    /* =========================================
       FONT
    ========================================= */

    @font-face {
        font-family: "Pretendard";
        src: url("{{ asset_path }}/PretendardVariable.ttf")
             format("truetype");
        font-style: normal;
        font-weight: 100 900;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 1080px;
        height: 1920px;

        margin: 0;
        padding: 0;

        overflow: hidden;
    }

    body {
        font-family:
            Pretendard,
            "Noto Sans KR",
            Arial,
            sans-serif;

        color: #ffffff;

        background: #050b12;
    }

    .page {
        position: relative;

        width: 1080px;
        height: 1920px;

        overflow: hidden;

        background:
            radial-gradient(
                circle at 50% 24%,
                rgba(26, 42, 61, 0.46) 0%,
                rgba(9, 18, 29, 0.18) 38%,
                rgba(5, 11, 18, 0) 65%
            ),
            linear-gradient(
                180deg,
                #09131f 0%,
                #07111b 45%,
                #050b12 100%
            );
    }


    /* =========================================
       HEADER
    ========================================= */

    .header {
        position: absolute;

        top: 72px;
        left: 80px;
        right: 80px;

        display: flex;
        justify-content: space-between;
        align-items: flex-start;

        z-index: 100;
    }


    /* =========================================
       HEADER BRAND
    ========================================= */

    .header-brand {
        display: flex;
        flex-direction: column;
        align-items: flex-start;

        opacity: 0.5;
    }


    /* AP Daily Logo */

    .logo {
        width: 250px;
        height: auto;

        display: block;
    }


    /* Date */

    .header-subtitle {
        margin-top: 16px;

        font-size: 25px;
        font-weight: 500;
        line-height: 1;

        color: #ffffff;
    }


    /* =========================================
       PAGE NUMBER
    ========================================= */

    .page-number {
        position: absolute;

        top: 8px;
        right: 0;

        font-size: 29px;
        font-weight: 700;

        letter-spacing: 0.8px;

        color: rgba(
            255,
            255,
            255,
            0.82
        );
    }


    /* =========================================
       CONTENT
    ========================================= */

    .content {
        position: absolute;

        top: 310px;
        left: 84px;
        right: 110px;

        bottom: 250px;

        display: flex;
        flex-direction: column;

        z-index: 10;
    }

    /*
    Shorts UI가 오른쪽에 겹치므로
    right 여백은 왼쪽보다 조금 크게 유지.
    */


    /* =========================================
       FOOTER
    ========================================= */

    .footer {
        position: absolute;

        left: 82px;
        right: 112px;

        bottom: 32px;

        min-height: 82px;

        padding-top: 24px;

        border-top:
            1px solid
            rgba(
                212,
                175,
                55,
                0.24
            );

        display: flex;
        align-items: flex-start;
        justify-content: center;

        z-index: 20;
    }


    .footer-inner {
        display: flex;
        align-items: center;
        justify-content: center;

        gap: 24px;

        width: 100%;
    }


    .footer-logo {
        width: 170px;
        height: auto;

        opacity: 0.62;
    }


    .footer-divider {
        width: 1px;
        height: 38px;

        background:
            rgba(
                255,
                255,
                255,
                0.20
            );
    }


    .footer-powered {
        font-size: 18px;
        line-height: 1.35;

        color:
            rgba(
                255,
                255,
                255,
                0.48
            );

        text-align: center;
    }


    .footer-powered strong {
        color: rgba(212, 175, 55, 0.78);
        font-weight: 700;
    }


    .footer-right {
        font-size: 14px;
        line-height: 1.45;

        color:
            rgba(
                255,
                255,
                255,
                0.30
            );

        text-align: left;
    }


    /* =========================================
       COMMON
    ========================================= */

    .gold {
        color: #F6D85B;
    }


    {% block style %}
    {% endblock %}

</style>


<div class="page">

    <header class="header">

        <div class="header-brand">

            <img
                src="{{ asset_path }}/icons/APDaily.svg"
                class="logo"
                alt="AP Daily"
            >

            <div class="header-subtitle">
                {{ today }}
            </div>

        </div>


        <div class="page-number">
            {{ page }} / {{ total }}
        </div>

    </header>


    <main class="content">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">

        <div class="footer-inner">

            <img
                class="footer-logo"
                src="{{ asset_path }}/icons/logo_white.svg"
                alt="AssetPicker"
            >


            <div class="footer-divider"></div>


            <div class="footer-powered">
                Powered by<br>
                <strong>Dustie</strong>
            </div>


            <div class="footer-divider"></div>


            <div class="footer-right">
                Copyright © AssetPicker<br>
                Built with DustyDraft®
            </div>

        </div>

    </footer>

</div>
