{% extends "base.html" %}

{% block styles %}

<link
    rel="stylesheet"
    href="{{ asset_path }}/css/ending.css"
>

{% endblock %}

{% block content %}

<div class="card">

    <img
        class="bg"
        src="{{ asset_path }}/images/ending.png"
        alt=""
    >

    <div class="overlay"></div>

    <header class="header">

        <img
            src="{{ asset_path }}/icons/APDaily_black.svg"
            class="logo"
            alt=""
        >

        <div class="page">

            {{ page }} / {{ total }}

        </div>

    </header>

    <main class="content">

        <img
            src="{{ asset_path }}/images/dustie-person.png"
            class="dustie"
            alt="AI Editor Dustie"
        >

        <div class="dustie-title">

            AI Editor Dustie
        
        </div>

        <div class="eyebrow">

            TODAY'S BRIEF COMPLETE <br/>
            SEE YOU TOMORROW

        </div>

        <h1>

            내일도 가장 빠른<br>
            부동산 브리핑으로<br>
            찾아오겠습니다.

        </h1>

        <p>

            매일 아침 업데이트

        </p>

    </main>

    <footer class="footer">

        <div class="footer-divider"></div>
    
        <div class="footer-content">
    
            <div class="footer-left">
    
                <img
                    src="{{ asset_path }}/icons/logo_white.svg"
                    class="footer-logo"
                    alt=""
                >
    
                <div class="footer-powered">
    
                    Powered by <strong>Dustie</strong>
    
                </div>
    
            </div>
    
            <div class="footer-right">
    
                Copyright © <strong>AssetPicker</strong>
                · Built with DustyDraft®
    
            </div>
    
        </div>
    
    </footer>

</div>

{% endblock %}
