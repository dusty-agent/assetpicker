name: AP Daily

on:
  workflow_dispatch:

  schedule:
    # 한국시간 오전 6:30 (UTC 전날 21:30)
    - cron: "30 21 * * *"


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # Python Dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # Playwright / Chromium
      # ==========================================

      - name: Install Playwright
        run: |
          playwright install --with-deps chromium


      # ==========================================
      # FFmpeg
      # ==========================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ==========================================
      # 날짜 추가
      # ==========================================
      
      - name: Set KST date
        run: |
          echo "AP_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_ENV


      # ==========================================
      # Run AP Daily
      #
      # Collect
      # → Curate
      # → Card News
      # → Shorts Images
      # → Shorts MP4
      # → Email
      # ==========================================

      - name: Run AP Daily
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}

        run: |
          python -m app.daily.main


      # ==========================================
      # Upload Complete Daily Output
      # ==========================================

      - name: Upload AP Daily Output
        uses: actions/upload-artifact@v4

        with:
          name: ap-daily-${{ env.AP_DATE }}

          path: |
            output/daily/*/*.png
            output/daily/*/shorts/*.png
            output/daily/*/ap_daily_short_*.mp4
            data/daily/*/*.json

          retention-days: 30

          if-no-files-found: warn